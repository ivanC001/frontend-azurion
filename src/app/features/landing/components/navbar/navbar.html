<header class="navbar" [class.navbar--scrolled]="isScrolled">
  <div class="navbar__inner">
    <a
      class="brand"
      routerLink="/inicio"
      fragment="inicio"
      aria-label="AZURION inicio"
      (click)="closeMenu()"
    >
      <span class="brand__mark">
        <img src="assets/logosinfondo.png" alt="AZURION Logo" />
      </span>
      <span class="brand__copy">
        <span class="brand__title">AZURION</span>
        <span class="brand__tagline">ERP &bull; CRM &bull; SUNAT</span>
      </span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Abrir menú"
      [attr.aria-expanded]="isMenuOpen"
      (click)="toggleMenu()"
    >
      <i class="pi" [class.pi-bars]="!isMenuOpen" [class.pi-times]="isMenuOpen"></i>
    </button>

    <div class="navbar__panel" [class.navbar__panel--open]="isMenuOpen">
      <nav class="nav-links" aria-label="Navegación principal">
        @for (item of navItems; track item.label) {
          <a [routerLink]="['/inicio']" [fragment]="item.fragment" (click)="closeMenu()">
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="navbar__actions">
        <a class="nav-login" routerLink="/auth" (click)="closeMenu()">
          <i class="pi pi-sign-in"></i>
          <span>Ingresar</span>
        </a>
        <a class="nav-demo-btn" routerLink="/inicio" fragment="contacto" (click)="closeMenu()">
          <i class="pi pi-sparkles"></i>
          <span>Solicitar Demo</span>
        </a>
      </div>
    </div>
  </div>
</header>
